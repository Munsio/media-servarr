# Default values for the seerr chart. app-template is a Helm chart
# *dependency* here (see Chart.yaml), not the chart being installed directly —
# Helm only passes a subchart the slice of these values nested under a key
# matching the subchart's name. Everything below therefore lives under
# `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  controllers:
    main:
      type: statefulset
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
      containers:
        main:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: "3.3.0"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            LOG_LEVEL: info
            TZ: UTC
          ports:
            - name: http
              containerPort: 5055
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /api/v1/settings/public
              port: http
              spec:
                initialDelaySeconds: 20
            readiness:
              enabled: true
              type: HTTP
              path: /api/v1/settings/public
              port: http
              spec:
                initialDelaySeconds: 15

  service:
    main:
      controller: main
      ports:
        http:
          port: 5055

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: seerr.media-servarr.local
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: seerr-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /app/config
