# Default values for the sonarr chart. app-template is a Helm chart
# *dependency* here (see Chart.yaml), not the chart being installed directly —
# Helm only passes a subchart the slice of these values nested under a key
# matching the subchart's name. Everything below therefore lives under
# `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  secrets:
    sonarr:
      stringData:
        apiKey: ''

  configMaps:
    config:
      data:
        config.xml: |
          <Config>
              <LogLevel>info</LogLevel>
              <EnableSsl>False</EnableSsl>
              <Port>8989</Port>
              <UrlBase>sonarr</UrlBase>
              <BindAddress>*</BindAddress>
              <ApiKey>$apiKey</ApiKey>
              <AnalyticsEnabled>False</AnalyticsEnabled>
              <AuthenticationMethod>External</AuthenticationMethod>
              <UpdateMechanism>Docker</UpdateMechanism>
              <Branch>main</Branch>
              <InstanceName>Sonarr</InstanceName>
            </Config>

  controllers:
    main:
      type: statefulset
      initContainers:
        prepare-config:
          image:
            repository: alpine
            tag: "3.24"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              sed -e "s/\$apiKey/$apiKey/g" /config-map/config.xml > /config-processed/config.xml
          env:
            apiKey:
              valueFrom:
                secretKeyRef:
                  name: sonarr
                  key: apiKey
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: "4.0.17"
          env:
            PGID: "1000"
            PUID: "1000"
          ports:
            - name: http
              containerPort: 8989
        metrics:
          enabled: false
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: 2.3.0
          args:
            - sonarr
          env:
            PORT: "9706"
            URL: "http://localhost:8989/sonarr"
            APIKEY:
              valueFrom:
                secretKeyRef:
                  name: sonarr
                  key: apiKey
          ports:
            - name: monitoring
              containerPort: 9706
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /healthz
              port: monitoring
            readiness:
              enabled: true
              type: HTTP
              path: /healthz
              port: monitoring
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 8989
        monitoring:
          enabled: false
          port: 9706

  serviceMonitor:
    main:
      enabled: false
      endpoints:
        - port: monitoring
          interval: 4m
          scrapeTimeout: 90s
          path: /metrics

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: media-servarr.local
          paths:
            - path: /sonarr
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: sonarr-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    raw-config:
      type: configMap
      identifier: config
      advancedMounts:
        main:
          prepare-config:
            - path: /config-map
    processed-config:
      type: emptyDir
      advancedMounts:
        main:
          prepare-config:
            - path: /config-processed
          main:
            - path: /config/config.xml
              subPath: config.xml
    downloads:
      type: emptyDir
      globalMounts:
        - path: /downloads
    tv:
      type: emptyDir
      globalMounts:
        - path: /tv