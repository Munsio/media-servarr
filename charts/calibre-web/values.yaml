# Default values for the calibre-web chart. app-template is a Helm chart
# *dependency* here (see Chart.yaml), not the chart being installed directly —
# Helm only passes a subchart the slice of these values nested under a key
# matching the subchart's name. Everything below therefore lives under
# `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  controllers:
    main:
      type: statefulset
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/calibre-web
            tag: "0.6.27"
          env:
            PGID: "1000"
            PUID: "1000"
          ports:
            - name: http
              containerPort: 8083

  service:
    main:
      controller: main
      ports:
        http:
          port: 8083

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: media-servarr.local
          paths:
            - path: /calibre-web
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: calibre-web-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    books:
      type: emptyDir
      globalMounts:
        - path: /books
