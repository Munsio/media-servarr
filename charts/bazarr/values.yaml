# Default values for the bazarr chart. app-template is a Helm chart *dependency*
# here (see Chart.yaml), not the chart being installed directly — Helm only
# passes a subchart the slice of these values nested under a key matching the
# subchart's name. Everything below therefore lives under `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  secrets:
    bazarr:
      stringData:
        apiKey: ''

  configMaps:
    config:
      data:
        config.yaml: |
          ---
          # We can set up a lot of extra settings, and providers, directly here
          # To get an example of an exhaustive list of of possible values you could add here see:
          #   ./config.example.yaml
          analytics:
            enabled: false
          auth:
            apiKey: '$apiKey'
          general:
            adaptive_searching: true
            auto_update: false
            base_url: '/bazarr'
            port: 6767
            use_radarr: false
            use_sonarr: false
            # radarr:
            #   apiKey: '$radarrApiKey'
            #   base_url: '/radarr'
            #   ip: 'radarr.media-servarr.svc.cluster.local'
            #   port: 7878
            # sonarr:
            #   apiKey: '$sonarrApiKey'
            #   base_url: '/sonarr'
            #   ip: 'sonarr.media-servarr.svc.cluster.local'
            #   port: 8989

  controllers:
    main:
      type: statefulset
      initContainers:
        prepare-config:
          image:
            repository: alpine
            tag: "3.24"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              sed -e "s/\$apiKey/$apiKey/g" /config-map/config.yaml > /config-processed/config.yaml
          env:
            apiKey:
              valueFrom:
                secretKeyRef:
                  name: bazarr
                  key: apiKey
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/bazarr
            tag: "1.5.6"
          env:
            PGID: "1000"
            PUID: "1000"
          ports:
            - name: http
              containerPort: 6767
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /bazarr/system/status
              port: http
              spec:
                initialDelaySeconds: 30
            readiness:
              enabled: true
              type: HTTP
              path: /bazarr/system/status
              port: http
              spec:
                initialDelaySeconds: 15
        metrics:
          enabled: false
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v1.6.1
          args:
            - bazarr
          env:
            PORT: "9700"
            URL: "http://localhost:6767/bazarr"
            APIKEY:
              valueFrom:
                secretKeyRef:
                  name: bazarr
                  key: apiKey
          ports:
            - name: monitoring
              containerPort: 9700
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /healthz
              port: monitoring
            readiness:
              enabled: true
              type: HTTP
              path: /healthz
              port: monitoring
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 6767
        monitoring:
          enabled: false
          port: 9700

  serviceMonitor:
    main:
      enabled: false
      endpoints:
        - port: monitoring
          interval: 4m
          scrapeTimeout: 90s
          path: /metrics

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: media-servarr.local
          paths:
            - path: /bazarr
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: bazarr-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    raw-config:
      type: configMap
      identifier: config
      advancedMounts:
        main:
          prepare-config:
            - path: /config-map
    processed-config:
      type: emptyDir
      advancedMounts:
        main:
          prepare-config:
            - path: /config-processed
          main:
            - path: /config/config/config.yaml
              subPath: config.yaml