# Default values for the audiobookshelf chart. app-template is a Helm chart
# *dependency* here (see Chart.yaml), not the chart being installed directly —
# Helm only passes a subchart the slice of these values nested under a key
# matching the subchart's name. Everything below therefore lives under
# `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  controllers:
    main:
      type: statefulset
      containers:
        main:
          image:
            repository: ghcr.io/advplyr/audiobookshelf
            tag: "2.36.0"
          ports:
            - name: http
              containerPort: 80

  service:
    main:
      controller: main
      ports:
        http:
          port: 80

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: media-servarr.local
          paths:
            - path: /audiobookshelf
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: audiobookshelf-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    metadata:
      type: persistentVolumeClaim
      forceRename: audiobookshelf-metadata
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /metadata
    audiobooks:
      type: emptyDir
      globalMounts:
        - path: /audiobooks
    podcasts:
      type: emptyDir
      globalMounts:
        - path: /podcasts
