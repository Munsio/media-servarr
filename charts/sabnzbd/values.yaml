# Default values for the sabnzbd chart. app-template is a Helm chart
# *dependency* here (see Chart.yaml), not the chart being installed directly —
# Helm only passes a subchart the slice of these values nested under a key
# matching the subchart's name. Everything below therefore lives under
# `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  secrets:
    sabnzbd:
      stringData:
        apiKey: apiKey
        nzbKey: nzbKey
        newsreaderServerPassword: password123

  configMaps:
    config:
      data:
        sabnzbd.ini: |
          [misc]
          language = en
          queue_limit = 20
          port = 8080
          api_key = $apiKey
          nzb_key = $nzbKey
          download_dir = Downloads/incomplete
          complete_dir = Downloads/complete
          host_whitelist =
          # [servers]
          # [[yournewsreader.example.org]]
          # name = yournewsreader.example.org
          # displayname = yourNewsReader
          # host = yournewsreader.example.org
          # port = 563
          # username = username
          # password = $newsreaderServerPassword
          # connections = 8
          # ssl = 1
          # ssl_verify = 2
          # enable = 1
          # priority = 0

  controllers:
    main:
      type: statefulset
      initContainers:
        prepare-config:
          image:
            repository: alpine
            tag: "3.24"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              sed \
                -e "s/\$apiKey/$apiKey/g" \
                -e "s/\$nzbKey/$nzbKey/g" \
                -e "s/\$newsreaderServerPassword/$newsreaderServerPassword/g" \
                /config-map/sabnzbd.ini > /config-processed/sabnzbd.ini
          env:
            apiKey:
              valueFrom:
                secretKeyRef:
                  name: sabnzbd
                  key: apiKey
            nzbKey:
              valueFrom:
                secretKeyRef:
                  name: sabnzbd
                  key: nzbKey
            newsreaderServerPassword:
              valueFrom:
                secretKeyRef:
                  name: sabnzbd
                  key: newsreaderServerPassword
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/sabnzbd
            tag: "5.1.1"
          env:
            PGID: "1000"
            PUID: "1000"
          ports:
            - name: http
              containerPort: 8080
        metrics:
          enabled: true
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: 2.3.0
          args:
            - sabnzbd
          env:
            PORT: "9707"
            URL: "http://localhost:8080/sabnzbd"
            APIKEY:
              valueFrom:
                secretKeyRef:
                  name: sabnzbd
                  key: apiKey
          ports:
            - name: monitoring
              containerPort: 9707
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /healthz
              port: monitoring
            readiness:
              enabled: true
              type: HTTP
              path: /healthz
              port: monitoring
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 8080
        monitoring:
          enabled: true
          port: 9707

  serviceMonitor:
    main:
      enabled: true
      endpoints:
        - port: monitoring
          interval: 4m
          scrapeTimeout: 90s
          path: /metrics

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: media-servarr.local
          paths:
            - path: /sabnzbd
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: sabnzbd-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    raw-config:
      type: configMap
      identifier: config
      advancedMounts:
        main:
          prepare-config:
            - path: /config-map
    processed-config:
      type: emptyDir
      advancedMounts:
        main:
          prepare-config:
            - path: /config-processed
          main:
            - path: /config/sabnzbd.ini
              subPath: sabnzbd.ini
    downloads:
      type: emptyDir
      globalMounts:
        - path: /config/Downloads