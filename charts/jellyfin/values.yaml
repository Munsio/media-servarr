# Default values for the jellyfin chart. app-template is a Helm chart
# *dependency* here (see Chart.yaml), not the chart being installed directly —
# Helm only passes a subchart the slice of these values nested under a key
# matching the subchart's name. Everything below therefore lives under
# `app-template:`.
# See https://bjw-s-labs.github.io/helm-charts/docs/app-template/ for the full schema.

app-template:
  configMaps:
    config:
      data:
        network.xml: |
          <?xml version="1.0" encoding="utf-8"?>
          <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <BaseUrl>jellyfin</BaseUrl>
            <HttpServerPortNumber>8096</HttpServerPortNumber>
            <EnableHttps>false</EnableHttps>
            <PublicPort>8096</PublicPort>
            <EnableRemoteAccess>true</EnableRemoteAccess>
          </NetworkConfiguration>

  controllers:
    main:
      type: statefulset
      containers:
        main:
          image:
            repository: jellyfin/jellyfin
            tag: "10.11.0"
          ports:
            - name: http
              containerPort: 8096

  service:
    main:
      controller: main
      ports:
        http:
          port: 8096

  ingress:
    main:
      enabled: true
      className: ""
      annotations: {}
      hosts:
        - host: media-servarr.local
          paths:
            - path: /jellyfin
              pathType: Prefix
              service:
                identifier: main
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      forceRename: jellyfin-config
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    raw-config:
      type: configMap
      identifier: config
      advancedMounts:
        main:
          main:
            - path: /config/config/network.xml
              subPath: network.xml
    ebooks:
      type: emptyDir
      globalMounts:
        - path: /ebooks
    film:
      type: emptyDir
      globalMounts:
        - path: /film
    music:
      type: emptyDir
      globalMounts:
        - path: /music
    television:
      type: emptyDir
      globalMounts:
        - path: /tv
